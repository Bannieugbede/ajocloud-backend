name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ajocloud_test
          POSTGRES_USER: ajocloud_test
          POSTGRES_PASSWORD: test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ajocloud_test -d ajocloud_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: ajocloud_test
          RABBITMQ_DEFAULT_PASS: test_only
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s
          --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      APP_NAME: Ajo Cloud CI
      APP_VERSION: ci
      HOST: 127.0.0.1
      PORT: 3000
      API_PREFIX: api
      CORS_ORIGINS: http://localhost
      LOG_LEVEL: silent
      DATABASE_URL: postgresql://ajocloud_test:test_only@localhost:5432/ajocloud_test?schema=public
      REDIS_URL: redis://localhost:6379/0
      RABBITMQ_URL: amqp://ajocloud_test:test_only@localhost:5672
      JWT_ACCESS_SECRET: ci-only-access-secret-at-least-32-characters
      JWT_ACCESS_TTL: 5m
      TOKEN_PEPPER: ci-only-token-pepper-at-least-32-characters
      JWT_REFRESH_TTL_SECONDS: 3600
      IDEMPOTENCY_TTL_SECONDS: 300
      PAYMENT_PROVIDER: mock
      KYC_PROVIDER: mock
      SWAGGER_ENABLED: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run prisma:validate
      - run: bun run prisma:generate
      - run: bun run prisma:migrate:deploy
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:unit
      - run: bun run test:integration
      - run: bun run test:e2e
      - run: bun run build
      - run: bun audit --production
