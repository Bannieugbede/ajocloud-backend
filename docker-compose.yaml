

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      # Coolify reads this to route the domain and issue TLS.
      SERVICE_FQDN_API: ${API_DOMAIN}
      NODE_ENV: production
      APP_NAME: ${APP_NAME:-Ajo Cloud API}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      HOST: 0.0.0.0
      PORT: ${PORT:-3000}
      API_PREFIX: ${API_PREFIX:-api}
      # Comma-separated browser origins, e.g. https://ajo.example.com
      CORS_ORIGINS: ${CORS_ORIGINS}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Point these at the Coolify-managed Postgres and Redis resources. Use the
      # internal hostnames Coolify assigns so traffic never leaves the network.
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-ajocloud}:${RABBITMQ_PASSWORD}@rabbitmq:5672

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      TOKEN_PEPPER: ${TOKEN_PEPPER}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-2592000}
      IDEMPOTENCY_TTL_SECONDS: ${IDEMPOTENCY_TTL_SECONDS:-86400}

      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-NGN}
      APPLICATION_TIMEZONE: ${APPLICATION_TIMEZONE:-Africa/Lagos}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}

      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      BILL_PAYMENT_PROVIDER: ${BILL_PAYMENT_PROVIDER:-mock}
      KYC_PROVIDER: ${KYC_PROVIDER:-mock}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      # Expo push needs no server key for tokens Expo itself issued.
      PUSH_PROVIDER: ${PUSH_PROVIDER:-mock}

      AWS_REGION: ${AWS_REGION:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_WEBHOOK_SECRET: ${PAYSTACK_WEBHOOK_SECRET:-}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY:-}
      MONNIFY_BASE_URL: ${MONNIFY_BASE_URL:-}
      MONNIFY_API_KEY: ${MONNIFY_API_KEY:-}
      MONNIFY_SECRET_KEY: ${MONNIFY_SECRET_KEY:-}
      MONNIFY_CONTRACT_CODE: ${MONNIFY_CONTRACT_CODE:-}
      MONNIFY_WEBHOOK_SECRET: ${MONNIFY_WEBHOOK_SECRET:-}
      DOJAH_BASE_URL: ${DOJAH_BASE_URL:-}
      DOJAH_APP_ID: ${DOJAH_APP_ID:-}
      DOJAH_SECRET_KEY: ${DOJAH_SECRET_KEY:-}

      RESEND_BASE_URL: ${RESEND_BASE_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_SENDER_EMAIL: ${RESEND_SENDER_EMAIL:-}
      RESEND_SENDER_NAME: ${RESEND_SENDER_NAME:-Ajo Cloud}

      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      ERROR_MONITORING_DSN: ${ERROR_MONITORING_DSN:-}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/'+(process.env.API_PREFIX||'api')+'/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  rabbitmq:
    image: rabbitmq:4-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ajocloud}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  rabbitmq-data:
