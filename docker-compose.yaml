services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      # --- Routing (Coolify reads SERVICE_FQDN_API to issue TLS) -------------
      SERVICE_FQDN_API: ${API_DOMAIN}
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: ${PORT:-3000}
      API_PREFIX: ${API_PREFIX:-api}
      APP_NAME: ${APP_NAME:-Ajo Cloud API}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
      SESSION_COOKIE_SAMESITE_NONE: ${SESSION_COOKIE_SAMESITE_NONE:-false}

      # --- Datastores --------------------------------------------------------
      # Use the internal hostnames Coolify assigns so traffic stays on its
      # private network.
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-ajocloud}:${RABBITMQ_PASSWORD}@rabbitmq:5672

      # --- Secrets (each must be a distinct 32+ character random string) -----
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      TOKEN_PEPPER: ${TOKEN_PEPPER}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-2592000}
      IDEMPOTENCY_TTL_SECONDS: ${IDEMPOTENCY_TTL_SECONDS:-86400}

      # --- Business defaults -------------------------------------------------
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-NGN}
      APPLICATION_TIMEZONE: ${APPLICATION_TIMEZONE:-Africa/Lagos}

      # --- Providers ---------------------------------------------------------
      # All default to "mock"/"console", which log instead of calling a live
      # service. The keys below each provider are only read once it is switched.
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      BILL_PAYMENT_PROVIDER: ${BILL_PAYMENT_PROVIDER:-mock}
      KYC_PROVIDER: ${KYC_PROVIDER:-mock}
      PUSH_PROVIDER: ${PUSH_PROVIDER:-mock}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}

      # Google sign-in. Unset disables it; set all four to enable.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      GOOGLE_WEB_SUCCESS_URL: ${GOOGLE_WEB_SUCCESS_URL:-}
      GOOGLE_MOBILE_SUCCESS_URL: ${GOOGLE_MOBILE_SUCCESS_URL:-ajocloud:///auth/google}

      # Required when EMAIL_PROVIDER=resend
      RESEND_BASE_URL: ${RESEND_BASE_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_SENDER_EMAIL: ${RESEND_SENDER_EMAIL:-}
      RESEND_SENDER_NAME: ${RESEND_SENDER_NAME:-Ajo Cloud}

      # Required when PAYMENT_PROVIDER, BILL_PAYMENT_PROVIDER, or KYC_PROVIDER
      # is monnify. Monnify is the single payments, verification, and payout
      # provider (ADR-005).
      MONNIFY_BASE_URL: ${MONNIFY_BASE_URL:-}
      MONNIFY_API_KEY: ${MONNIFY_API_KEY:-}
      MONNIFY_SECRET_KEY: ${MONNIFY_SECRET_KEY:-}
      MONNIFY_CONTRACT_CODE: ${MONNIFY_CONTRACT_CODE:-}
      MONNIFY_WEBHOOK_SECRET: ${MONNIFY_WEBHOOK_SECRET:-}
      # Webhook ingestion; requires MONNIFY_WEBHOOK_SECRET when true (ADR-006).
      MONNIFY_WEBHOOKS_ENABLED: ${MONNIFY_WEBHOOKS_ENABLED:-true}
      # Sandbox KYC fallback for test keys. Refused when NODE_ENV=production.
      KYC_SANDBOX_FALLBACK: ${KYC_SANDBOX_FALLBACK:-true}

      # Document uploads (S3)
      AWS_REGION: ${AWS_REGION:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

      # Observability
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      ERROR_MONITORING_DSN: ${ERROR_MONITORING_DSN:-}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/'+(process.env.API_PREFIX||'api')+'/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  rabbitmq:
    image: rabbitmq:4-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ajocloud}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  rabbitmq-data:
